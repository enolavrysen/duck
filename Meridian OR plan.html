      mockNav: () => this.say('Only this case screen is built in the mock-up.'),
      mockCamera: () => this.say('The camera is not part of this mock-up.'),
      changePlan: () => { this.setState({ menu: false }); this.say('Editing the plan is not part of this mock-up.'); },
      closePane: () => this.setState({ tab: 'plan', peek: false, full: false }),
      openPrefs: () => this.setState({ tab: 'prefs', loc: null, menu: false }),
      toggleMenu: () => this.setState({ menu: !s.menu }),
      closeMenu: () => this.setState({ menu: false }),
      pickOwn: () => this.setState({ card: 'pref', menu: false }),
      pickStd: () => this.setState({ card: 'std', menu: false, tab: tab === 'prefs' ? 'plan' : tab }),

      grabTap: () => { if (Date.now() - (this._swipedAt || 0) < 400) return; this.grab(0); },
      grabDown: (e) => {
        const b = e.target && e.target.closest ? e.target.closest('button') : null;
        if (b && b !== e.currentTarget) return;
        this._gy = e.clientY;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
      },
      grabUp: (e) => { if (this._gy == null) return; const dy = e.clientY - this._gy; this._gy = null; if (Math.abs(dy) > 24) { this._swipedAt = Date.now(); this.grab(dy < 0 ? -1 : 1); } },
      grabCancel: () => { this._gy = null; },
    };
  }
}

(function () {
  const frame = document.getElementById('frame'), probe = document.getElementById('probe');
  const tree = Tpl.parse(document.getElementById('tpl').textContent);
  const q = new URLSearchParams(location.search);
  const comp = new Component({ orientation: 'portrait', tab: q.get('tab') || '', sheet: q.get('sheet') || '', numbers: q.get('numbers') || '', step: q.get('step') || '1' });
  comp.vp = { W: 390, H: 844, st: 0, sb: 0, sl: 0, sr: 0 };
  function measure() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const cs = getComputedStyle(probe);
    const ins = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    const portrait = vh >= vw;
    let k, W, H;
    if (portrait) { k = Math.min(vw / 390, 1.6); W = 390; H = Math.max(560, vh / k); }
    else { k = Math.min(vh / 390, 1.6); H = 390; W = Math.max(640, vw / k); }
    comp.props.orientation = portrait ? 'portrait' : 'landscape';
    comp.vp = { W, H: portrait ? H : 390, st: portrait ? ins.t / k : 0, sb: portrait ? ins.b / k : 0, sl: ins.l / k, sr: ins.r / k };
    frame.style.transform = 'scale(' + k + ')';
    frame.style.left = Math.max(0, (vw - W * k) / 2) + 'px';
  }
  function paint() {
    const hs = [];
    const html = Tpl.render(tree, comp.renderVals(), hs);
    const next = document.createElement('div'); next.innerHTML = html;
    if (!frame.firstChild) { while (next.firstChild) frame.appendChild(next.firstChild); } else morph(frame, next);
    frame.querySelectorAll('[data-on-click],[data-on-pointerdown],[data-on-pointerup],[data-on-pointercancel]').forEach((el) => {
      for (const ev of ['click', 'pointerdown', 'pointerup', 'pointercancel']) {
        const i = el.getAttribute('data-on-' + ev); el['on' + ev] = i == null ? null : hs[+i];
      }
    });
  }
  let raf = 0;
  comp._schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); };
  const relayout = () => { measure(); paint(); };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', () => setTimeout(relayout, 120));
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  relayout();
  window.__comp = comp;
})();
</script>
